name: Build and Release VinylPod

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile and Publish Standalone Executable
        run: dotnet publish VinylPod.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish_output

      - name: Automate GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          files: ./publish_output/VinylPod.exe